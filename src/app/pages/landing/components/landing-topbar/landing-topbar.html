<a routerLink="/" class="flex min-w-0 items-center gap-2 no-underline" aria-label="Aurexion home">
    <img src="assets/demo/images/logo/TAF.png" alt="" class="logo-image shrink-0" />
    <span class="truncate text-lg font-semibold tracking-tight text-slate-100 sm:text-xl">Aurexion</span>
</a>

<button
    type="button"
    pButton
    pRipple
    [text]="true"
    severity="secondary"
    [rounded]="true"
    class="lg:hidden! shrink-0 text-indigo-100!"
    pStyleClass="@next"
    enterFromClass="hidden"
    leaveToClass="hidden"
    [hideOnOutsideClick]="true"
    aria-label="Open menu"
>
    <app-svg-icon name="menu" [chip]="false" size="lg" />
</button>

<nav
    class="absolute left-0 top-full z-30 hidden w-full border-b border-indigo-400/20 bg-[#0b1220]/98 px-4 pb-4 pt-2 shadow-2xl shadow-black/40 lg:static lg:flex lg:w-auto lg:flex-1 lg:items-center lg:justify-end lg:border-0 lg:bg-transparent lg:p-0 lg:shadow-none"
    aria-label="Primary"
>
    <div class="flex flex-col gap-1 border-t border-indigo-400/15 pt-3 lg:flex-row lg:items-center lg:gap-1 lg:border-0 lg:pt-0 xl:gap-2">
        <button type="button" class="landing-nav-link" (click)="scrollToSection('overview')">How it works</button>
        <button type="button" class="landing-nav-link" (click)="scrollToSection('investors')">Investors</button>
        <button type="button" class="landing-nav-link" (click)="scrollToSection('borrowers')">Borrowers</button>
        <button type="button" class="landing-nav-link" (click)="scrollToSection('security')">Security</button>
        <button type="button" class="landing-nav-link" (click)="scrollToSection('faq')">FAQ</button>
        <div class="mt-3 flex flex-col gap-2 border-t border-indigo-400/15 pt-3 lg:mt-0 lg:ml-3 lg:flex-row lg:items-center lg:border-0 lg:pt-0 xl:ml-4">
            <button
                pButton
                pRipple
                type="button"
                label="Sign in"
                routerLink="/auth/login"
                severity="secondary"
                [outlined]="true"
                class="landing-signin-btn w-full! justify-center! lg:w-auto!"
            ></button>
            <button
                pButton
                pRipple
                type="button"
                label="Get started"
                routerLink="/auth/register"
                class="landing-cta-primary w-full! justify-center! lg:w-auto!"
            ></button>
        </div>
    </div>
</nav>
