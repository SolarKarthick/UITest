<div class="reset-page flex min-h-screen w-full items-center justify-center overflow-hidden px-4 py-6">
  <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -left-16 top-10 h-64 w-64 rounded-full bg-sky-300/35 blur-3xl"></div>
    <div class="absolute -right-12 bottom-16 h-72 w-72 rounded-full bg-blue-300/30 blur-3xl"></div>
  </div>

  <div class="relative z-10 w-full max-w-md">
    <div class="reset-glass overflow-hidden rounded-3xl">
      <div class="reset-header-wrap">
        <div class="reset-header">
          <div class="reset-header-copy">
            <p class="reset-header-title">Reset. Sign in again.</p>
          </div>
          <img
            src="assets/demo/images/register/arrows-rightside-icon.png"
            alt=""
            class="reset-header-icon"
            aria-hidden="true"
          />
        </div>
      </div>

      <div class="px-6 pb-8 pt-5 sm:px-8 sm:pb-10 sm:pt-6">
        <div class="mb-7 text-left">
          <h3 class="mb-2 text-xl font-semibold text-slate-800 sm:text-2xl">Reset password</h3>
          <p class="mb-4 text-sm text-slate-600 sm:text-base">
            Remember it?
            <a routerLink="/auth/login" class="font-semibold text-sky-600 underline-offset-2 hover:underline">Sign in</a>
          </p>
          <p class="text-sm leading-relaxed text-slate-500 sm:text-base">
            Enter your new password and confirm it.
          </p>
        </div>

        <p-fluid>
          <div class="flex flex-col gap-5">
            <div class="flex flex-col gap-2">
              <label for="new-password" class="font-semibold text-slate-700">New password</label>
              <p-password
                id="new-password"
                [(ngModel)]="password"
                (ngModelChange)="onPasswordChange()"
                (onBlur)="onPasswordBlur()"
                [toggleMask]="true"
                [feedback]="false"
                [fluid]="true"
                styleClass="w-full reset-password"
                inputStyleClass="w-full reset-input"
                [disabled]="isLoading"
                autocomplete="new-password"
                [invalid]="passwordTouched && !!passwordError"
              ></p-password>
              <small class="mt-1 block text-sm text-rose-600" *ngIf="passwordTouched && passwordError">
                {{ passwordError }}
              </small>
            </div>

            <div class="flex flex-col gap-2">
              <label for="confirm-password" class="font-semibold text-slate-700">Confirm password</label>
              <p-password
                id="confirm-password"
                [(ngModel)]="confirmPassword"
                (ngModelChange)="onConfirmPasswordChange()"
                (onBlur)="onConfirmPasswordBlur()"
                [toggleMask]="true"
                [feedback]="false"
                [fluid]="true"
                styleClass="w-full reset-password"
                inputStyleClass="w-full reset-input"
                [disabled]="isLoading"
                autocomplete="new-password"
                [invalid]="confirmPasswordTouched && !!confirmPasswordError"
              ></p-password>
              <small class="mt-1 block text-sm text-rose-600" *ngIf="confirmPasswordTouched && confirmPasswordError">
                {{ confirmPasswordError }}
              </small>
            </div>

            <button
              pButton
              pRipple
              type="button"
              label="Update password"
              styleClass="reset-primary-btn w-full h-12"
              [disabled]="isLoading"
              [loading]="isLoading"
              (click)="onResetPassword()"
            ></button>
          </div>
        </p-fluid>
      </div>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="successDialog"
  [style]="{ width: '90vw', maxWidth: '440px' }"
  [breakpoints]="{ '960px': '90vw', '640px': '95vw' }"
  header="Password updated"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  styleClass="reset-dialog"
>
  <div class="flex flex-col gap-4 px-1 pt-1 text-center sm:gap-5 sm:px-3">
    <div class="reset-success-icon mx-auto flex items-center justify-center rounded-full bg-sky-50 ring-1 ring-sky-200">
      <i class="pi pi-verified" aria-hidden="true"></i>
    </div>
    <p class="text-sm leading-relaxed text-slate-600 sm:text-base">
      Your password has been reset successfully. You can now sign in.
    </p>
  </div>
  <ng-template pTemplate="footer">
    <div class="w-full px-2 sm:px-0">
      <p-button
        label="Go to sign in"
        (onClick)="goToLogin()"
        styleClass="reset-primary-btn w-full text-sm sm:text-base"
        [style]="{ height: '44px' }"
      ></p-button>
    </div>
  </ng-template>
</p-dialog>

<p-dialog
  [(visible)]="errorDialog"
  [style]="{ width: '90vw', maxWidth: '450px' }"
  [breakpoints]="{ '960px': '90vw', '640px': '95vw' }"
  header="Something went wrong"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="reset-dialog"
>
  <div class="flex flex-col gap-4 px-1 pt-1 text-center sm:gap-5 sm:px-3">
    <div class="reset-error-icon mx-auto flex items-center justify-center rounded-full bg-rose-50 ring-1 ring-rose-200">
      <i class="pi pi-times-circle" aria-hidden="true"></i>
    </div>
    <p class="px-2 text-sm font-medium text-slate-700 sm:text-base">
      {{ errorMessage }}
    </p>
  </div>
  <ng-template pTemplate="footer">
    <div class="w-full px-2 sm:px-0">
      <p-button
        label="Try again"
        (onClick)="closeErrorDialog()"
        styleClass="w-full text-sm sm:text-base"
        severity="danger"
        [style]="{ height: '44px' }"
      ></p-button>
    </div>
  </ng-template>
</p-dialog>

<div *ngIf="isLoading" class="loading-overlay">
  <p-progressSpinner strokeWidth="4" animationDuration=".8s" styleClass="custom-spinner"></p-progressSpinner>
</div>
