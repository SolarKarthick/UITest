<section class="col-span-12">
  <div class="mb-3 flex flex-wrap items-end justify-between gap-2">
    <div>
      <h2 class="m-0 text-base font-semibold text-slate-800 sm:text-lg">Earnings & Rewards</h2>
      <p class="mt-1 m-0 text-xs text-slate-500 sm:text-sm">ROI, referrals, bonuses and potential upside</p>
    </div>
    <a routerLink="/app/detail/earnings" class="text-sm font-semibold text-indigo-600 no-underline hover:text-indigo-800">
      View details →
    </a>
  </div>

  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 sm:gap-4">
    @for (card of cards; track card.key) {
      <article
        class="dash-panel group rounded-2xl border border-indigo-100 bg-gradient-to-br from-indigo-50 via-sky-50 to-violet-50 p-4 shadow-sm transition duration-200 sm:p-5 sm:hover:-translate-y-0.5 sm:hover:shadow-md"
      >
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="m-0 text-xs font-medium uppercase tracking-[0.1em] text-indigo-600/80">{{ card.label }}</p>
            <p class="mt-2 m-0 truncate text-xl font-bold text-indigo-900 sm:text-2xl">
              ${{ card.value | number: '1.2-2' }}
            </p>
            <p class="mt-1.5 m-0 text-xs leading-snug text-slate-500">{{ card.note }}</p>
          </div>
          <app-svg-icon [name]="card.svg" [chip]="true" size="md" />
        </div>
      </article>
    }
  </div>
</section>
