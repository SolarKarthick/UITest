<section class="col-span-12">
  <div class="mb-3">
    <h2 class="m-0 text-base font-semibold text-slate-800 sm:text-lg">Quick Actions</h2>
    <p class="mt-1 m-0 text-xs text-slate-500 sm:text-sm">Jump to common account tasks</p>
  </div>

  <div class="qa-panel overflow-hidden rounded-2xl border border-indigo-100 bg-gradient-to-br from-indigo-50 via-white to-sky-50 shadow-sm">
    <div class="flex flex-col divide-y divide-indigo-100/80">
      @for (action of actions; track action.path) {
        <button
          pRipple
          type="button"
          [class]="action.accentClass"
          class="qa-row group flex w-full items-center gap-3 px-3.5 py-3.5 text-left transition-colors duration-200 sm:gap-4 sm:px-5 sm:py-4"
          (click)="goTo(action.path)"
        >
          <app-svg-icon [name]="action.svg" [chip]="true" size="lg" />
          <span class="min-w-0 flex-1">
            <span class="block text-sm font-semibold text-slate-800 sm:text-base">
              {{ action.label | translate }}
            </span>
            <span class="mt-0.5 block truncate text-xs text-slate-500 sm:text-sm">
              {{ action.desc }}
            </span>
          </span>
          <app-svg-icon name="chevron-right" [chip]="false" size="sm" />
        </button>
      }
    </div>
  </div>
</section>
