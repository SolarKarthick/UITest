<section class="col-span-12">
  <div class="mb-3 flex flex-wrap items-end justify-between gap-2">
    <div>
      <h2 class="m-0 text-base font-semibold text-slate-800 sm:text-lg">Referral Overview</h2>
      <p class="mt-1 m-0 text-xs text-slate-500 sm:text-sm">Invite performance at a glance</p>
    </div>
    <a routerLink="/app/detail/referrals" class="text-sm font-semibold text-indigo-600 no-underline hover:text-indigo-800">
      View details →
    </a>
  </div>

  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4">
    @for (card of cards; track card.key) {
      <article class="rounded-2xl border border-indigo-100 bg-gradient-to-br from-violet-50 via-indigo-50 to-sky-50 p-4 shadow-sm sm:p-5">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="m-0 text-xs font-medium uppercase tracking-[0.1em] text-indigo-600/80">{{ card.label }}</p>
            <p class="mt-2 m-0 text-2xl font-bold text-indigo-900 sm:text-3xl">{{ card.value }}</p>
            <p class="mt-1.5 m-0 text-xs text-slate-500">{{ card.note }}</p>
          </div>
          <app-svg-icon [name]="card.svg" [chip]="true" size="md" />
        </div>
      </article>
    }
  </div>
</section>
