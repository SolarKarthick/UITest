<section class="col-span-12">
  <div class="mb-3">
    <h2 class="m-0 text-base font-semibold text-slate-800 sm:text-lg">Pay-in & Pay-out Activity</h2>
    <p class="mt-1 m-0 text-xs text-slate-500 sm:text-sm">Most recent funding movements</p>
  </div>

  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4">
    @for (item of items; track item.label) {
      <article class="rounded-2xl border border-indigo-100 bg-gradient-to-br from-sky-50 via-white to-indigo-50 p-4 shadow-sm sm:p-5">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="m-0 text-xs font-medium uppercase tracking-[0.1em] text-indigo-600/80">{{ item.label }}</p>
            <p
              class="mt-2 m-0 truncate text-xl font-bold sm:text-2xl"
              [class.text-indigo-700]="item.tone === 'positive'"
              [class.text-slate-800]="item.tone === 'neutral'"
            >
              ${{ item.amount | number: '1.2-2' }}
            </p>
            <p class="mt-1.5 m-0 text-xs text-slate-500">{{ item.date }}</p>
          </div>
          <app-svg-icon [name]="item.svg" [chip]="true" size="md" />
        </div>
      </article>
    }
  </div>
</section>
